<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="hpBg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#2a0d0d"/>
      <stop offset="50%" stop-color="#140505"/>
      <stop offset="100%" stop-color="#050101"/>
    </radialGradient>
    <linearGradient id="hpFlame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4400"/>
      <stop offset="50%" stop-color="#ffaa00"/>
      <stop offset="100%" stop-color="#ffee55"/>
    </linearGradient>
    <linearGradient id="hpSteel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#94a3b8"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="hpGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="hpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="800" fill="url(#hpBg)"/>

  <!-- Geometric Grid & Energy Lines -->
  <g opacity="0.15">
    <line x1="100" y1="0" x2="100" y2="800" stroke="#ff4400" stroke-width="1.5" stroke-dasharray="10 10"/>
    <line x1="600" y1="0" x2="600" y2="800" stroke="#ffaa00" stroke-width="2"/>
    <line x1="1100" y1="0" x2="1100" y2="800" stroke="#ff4400" stroke-width="1.5" stroke-dasharray="10 10"/>
    <circle cx="600" cy="380" r="300" stroke="#ff4400" stroke-width="2" fill="none"/>
    <circle cx="600" cy="380" r="240" stroke="#ffaa00" stroke-width="1.5" stroke-dasharray="8 6" fill="none"/>
  </g>

  <!-- Hydraulic Press Illustration Silhouette -->
  <g transform="translate(600, 320)">
    <!-- Top Hydraulic Piston -->
    <rect x="-120" y="-220" width="240" height="70" rx="14" fill="url(#hpSteel)" stroke="#ffaa00" stroke-width="4"/>
    <rect x="-60" y="-150" width="120" height="130" fill="url(#hpSteel)" stroke="#ff4400" stroke-width="3"/>
    <!-- Heavy Press Head -->
    <path d="M -160 -20 L 160 -20 L 120 40 L -120 40 Z" fill="url(#hpSteel)" stroke="#ffee55" stroke-width="4"/>
    
    <!-- Sparks & Crushing Impact Core -->
    <ellipse cx="0" cy="65" rx="180" ry="25" fill="#ff4400" opacity="0.4" filter="url(#hpGlow)"/>
    <circle cx="0" cy="60" r="35" fill="#ffffff" filter="url(#hpGlow)"/>
    <path d="M -90 60 L -180 20 M -70 50 L -150 -10 M 80 50 L 170 10 M 60 70 L 140 100 M -40 80 L -120 130" stroke="#ffee55" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Anvil Base -->
    <rect x="-200" y="70" width="400" height="70" rx="10" fill="url(#hpSteel)" stroke="#ffaa00" stroke-width="4"/>
    <rect x="-250" y="140" width="500" height="40" rx="8" fill="#111827" stroke="#374151" stroke-width="3"/>
  </g>

  <!-- Top Badges -->
  <g transform="translate(100, 90)">
    <rect x="0" y="0" width="260" height="54" rx="27" fill="#ff4400" opacity="0.2" stroke="#ff4400" stroke-width="2"/>
    <circle cx="28" cy="27" r="12" fill="#ff4400"/>
    <text x="54" y="34" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" letter-spacing="1">500+ AI VIDEOS</text>
  </g>

  <g transform="translate(840, 90)">
    <rect x="0" y="0" width="260" height="54" rx="27" fill="#f59e0b" opacity="0.2" stroke="#f59e0b" stroke-width="2"/>
    <text x="130" y="34" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="1">⏱️ 30 SECONDS</text>
  </g>

  <!-- Title: HYDRAULIC PRESSURE -->
  <text x="600" y="580" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="68" font-weight="950" letter-spacing="3" stroke="#000000" stroke-width="6" paint-order="stroke fill">
    HYDRAULIC PRESSURE
  </text>
  <text x="600" y="635" text-anchor="middle" fill="url(#hpFlame)" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" letter-spacing="4">
    EXTREME CRUSHING &amp; VIRAL SHORTS PACK
  </text>

  <!-- Price Pill -->
  <g transform="translate(460, 670)">
    <rect x="0" y="0" width="280" height="74" rx="37" fill="#ff4400" stroke="#ffee55" stroke-width="4" filter="url(#hpGlow)"/>
    <text x="140" y="49" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="950" text-anchor="middle">
      ONLY ₹50
    </text>
  </g>
</svg>
