<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="cmBg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#3b0724"/>
      <stop offset="50%" stop-color="#1f0312"/>
      <stop offset="100%" stop-color="#080105"/>
    </radialGradient>
    <linearGradient id="cmPop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="cmRainbow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#a855f7"/>
      <stop offset="70%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="cmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#cmBg)"/>

  <!-- Magical Star Sparkles & Cartoon Bubbles -->
  <g opacity="0.3">
    <circle cx="200" cy="200" r="30" fill="#f43f5e"/>
    <circle cx="1000" cy="240" r="45" fill="#38bdf8"/>
    <circle cx="180" cy="450" r="25" fill="#fbbf24"/>
    <circle cx="1050" cy="480" r="35" fill="#a855f7"/>
  </g>

  <!-- 3D Animation Mascot / Clapper Art Centerpiece -->
  <g transform="translate(600, 300)">
    <!-- Magic Ring Glow -->
    <ellipse cx="0" cy="0" rx="200" ry="120" fill="none" stroke="url(#cmRainbow)" stroke-width="8" filter="url(#cmGlow)"/>
    
    <!-- Cute 3D Cartoon Eye Mascot Silhouette / Clapper -->
    <rect x="-140" y="-110" width="280" height="200" rx="30" fill="#0f172a" stroke="#f43f5e" stroke-width="6"/>
    <!-- Striped Clapper Bar -->
    <g transform="translate(-140, -110)">
      <polygon points="0,0 40,0 20,40 0,40" fill="#ffffff"/>
      <polygon points="60,0 100,0 80,40 40,40" fill="#f43f5e"/>
      <polygon points="120,0 160,0 140,40 100,40" fill="#ffffff"/>
      <polygon points="180,0 220,0 200,40 160,40" fill="#f43f5e"/>
      <polygon points="240,0 280,0 260,40 220,40" fill="#ffffff"/>
    </g>
    <!-- Big Anime / Pixar Eyes -->
    <ellipse cx="-55" cy="0" rx="35" ry="45" fill="#ffffff"/>
    <ellipse cx="55" cy="0" rx="35" ry="45" fill="#ffffff"/>
    <circle cx="-50" cy="0" r="20" fill="#38bdf8"/>
    <circle cx="60" cy="0" r="20" fill="#38bdf8"/>
    <circle cx="-42" cy="-8" r="8" fill="#ffffff"/>
    <circle cx="68" cy="-8" r="8" fill="#ffffff"/>
    <!-- Big Happy Smile -->
    <path d="M -40 45 Q 0 85 40 45" fill="none" stroke="#f43f5e" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Top Badges -->
  <g transform="translate(100, 90)">
    <rect x="0" y="0" width="260" height="54" rx="27" fill="#f43f5e" opacity="0.2" stroke="#f43f5e" stroke-width="2"/>
    <circle cx="28" cy="27" r="12" fill="#f43f5e"/>
    <text x="54" y="34" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" letter-spacing="1">300+ VIDEOS</text>
  </g>

  <g transform="translate(820, 90)">
    <rect x="0" y="0" width="280" height="54" rx="27" fill="#fb7185" opacity="0.2" stroke="#fb7185" stroke-width="2"/>
    <text x="140" y="34" fill="#fecdd3" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="1">⏱️ 1 HR 30 MIN</text>
  </g>

  <!-- Title: AI CARTOON MOVIE -->
  <text x="600" y="580" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="66" font-weight="950" letter-spacing="3" stroke="#000000" stroke-width="6" paint-order="stroke fill">
    AI CARTOON MOVIE
  </text>
  <text x="600" y="635" text-anchor="middle" fill="url(#cmPop)" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" letter-spacing="3">
    3D ANIMATED FEATURE FILMS &amp; ADVENTURES
  </text>

  <!-- Price Pill -->
  <g transform="translate(460, 670)">
    <rect x="0" y="0" width="280" height="74" rx="37" fill="#e11d48" stroke="#fb7185" stroke-width="4" filter="url(#cmGlow)"/>
    <text x="140" y="49" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="950" text-anchor="middle">
      ONLY ₹700
    </text>
  </g>
</svg>
