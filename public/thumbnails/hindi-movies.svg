<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="hmBg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#360a0a"/>
      <stop offset="50%" stop-color="#190303"/>
      <stop offset="100%" stop-color="#050000"/>
    </radialGradient>
    <linearGradient id="hmGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fde047"/>
      <stop offset="60%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="hmRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="hmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#hmBg)"/>

  <!-- Golden Spotlight Cinema Beams & Stars -->
  <g opacity="0.3">
    <polygon points="600,280 100,0 260,0" fill="#eab308"/>
    <polygon points="600,280 940,0 1100,0" fill="#eab308"/>
    <circle cx="600" cy="280" r="280" fill="none" stroke="#ca8a04" stroke-width="2" stroke-dasharray="14 10"/>
  </g>

  <!-- Bollywood Cinema Reel & Golden Star Marquee -->
  <g transform="translate(600, 290)">
    <!-- Golden Film Reel Outer -->
    <circle cx="0" cy="0" r="140" fill="#180404" stroke="url(#hmGold)" stroke-width="8" filter="url(#hmGlow)"/>
    <circle cx="0" cy="0" r="110" fill="#2d0a0a" stroke="#ca8a04" stroke-width="3"/>
    
    <!-- 5 Reel Holes -->
    <circle cx="0" cy="-60" r="22" fill="#0d0202" stroke="#eab308" stroke-width="3"/>
    <circle cx="57" cy="-18" r="22" fill="#0d0202" stroke="#eab308" stroke-width="3"/>
    <circle cx="35" cy="48" r="22" fill="#0d0202" stroke="#eab308" stroke-width="3"/>
    <circle cx="-35" cy="48" r="22" fill="#0d0202" stroke="#eab308" stroke-width="3"/>
    <circle cx="-57" cy="-18" r="22" fill="#0d0202" stroke="#eab308" stroke-width="3"/>
    <circle cx="0" cy="0" r="20" fill="url(#hmGold)"/>

    <!-- Dramatic Golden Cinema Star -->
    <path d="M 0 -185 L 18 -140 L 65 -140 L 27 -110 L 42 -65 L 0 -95 L -42 -65 L -27 -110 L -65 -140 L -18 -140 Z" fill="url(#hmGold)" filter="url(#hmGlow)"/>
  </g>

  <!-- Top Badges -->
  <g transform="translate(100, 90)">
    <rect x="0" y="0" width="260" height="54" rx="27" fill="#ef4444" opacity="0.25" stroke="#ef4444" stroke-width="2"/>
    <circle cx="28" cy="27" r="12" fill="#ef4444"/>
    <text x="54" y="34" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" letter-spacing="1">100+ MOVIES</text>
  </g>

  <g transform="translate(820, 90)">
    <rect x="0" y="0" width="280" height="54" rx="27" fill="#eab308" opacity="0.25" stroke="#eab308" stroke-width="2"/>
    <text x="140" y="34" fill="#fde047" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="1">⏱️ 1 HR 30 MIN</text>
  </g>

  <!-- Title: HINDI MOVIES -->
  <text x="600" y="580" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="76" font-weight="950" letter-spacing="4" stroke="#000000" stroke-width="6" paint-order="stroke fill">
    HINDI MOVIES
  </text>
  <text x="600" y="635" text-anchor="middle" fill="url(#hmGold)" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" letter-spacing="4">
    COMPLETE BLOCKBUSTER CINEMA COLLECTION
  </text>

  <!-- Price Pill -->
  <g transform="translate(450, 670)">
    <rect x="0" y="0" width="300" height="74" rx="37" fill="#b91c1c" stroke="url(#hmGold)" stroke-width="4" filter="url(#hmGlow)"/>
    <text x="150" y="49" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="950" text-anchor="middle">
      ONLY ₹1,000
    </text>
  </g>
</svg>
